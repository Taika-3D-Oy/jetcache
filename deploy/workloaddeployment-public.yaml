apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: jetcache
  annotations:
    description: jetcache storage service (public registry example)
spec:
  replicas: 1
  deployPolicy: RollingUpdate
  template:
    labels:
      app.kubernetes.io/name: jetcache
      app.kubernetes.io/component: storage
    spec:
      # NOTE: This service is built for wasm32-wasip2.
      # Your wasmCloud host must run with wasip2/3 enabled.
      components: []
      service:
        # Replace with your published OCI reference/tag.
        image: ghcr.io/taika-3d-oy/jetcache/storage-service:v2.0.0-rc.1
        maxRestarts: 5
        localResources:
          environment:
            config:
              # Use your cluster-reachable NATS endpoint.
              # If DNS is unavailable in your runtime/network stack, use a direct service IP.
              NATS_URL: "nats:4222"
              NATS_DATA_URL: "nats-data:4222"
              JETCACHE_INSTANCE: "lid"
              JETCACHE_DATA_INSTANCE: "lid"
              JETCACHE_CONSISTENCY_WATCHER_WAIT_STEPS: "2"
              JETCACHE_CONSISTENCY_WATCHER_WAIT_STEP_SECS: "1"
              # Encryption at rest is ON by default — the service refuses to
              # boot without a master key. Provide a 32+ byte key as hex or
              # base64 (inject from a Secret in real deployments):
              # JETCACHE_MASTER_KEY: "0123456789abcdef..."
              # Development-only alternative (deterministic key, NOT for production):
              # JETCACHE_DEV_SEED: "change-me"
              # Emergency escape hatch: run fully unencrypted (NOT recommended):
              # JETCACHE_ALLOW_PLAINTEXT: "1"
              # Temporary migration window for data written before encryption
              # became the default (remove once logs show no legacy values):
              # JETCACHE_MIGRATE_PLAINTEXT: "1"
      hostInterfaces:
        # Required so the service can open outgoing TCP connections to NATS.
        - namespace: wasi
          package: sockets
          interfaces:
            - tcp
