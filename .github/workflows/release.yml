name: Build & Push to GHCR

on:
  push:
    branches: [master]
    tags: ["v*"]

env:
  OCI_IMAGE: ghcr.io/taika-3d-oy/jetcache/storage-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      - name: Install ORAS CLI
        uses: oras-project/setup-oras@v1

      - name: Build storage-service
        run: cargo build --release -p storage-service --target wasm32-wasip2

      - name: Determine tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push to GHCR
        run: |
          oras push \
            "$OCI_IMAGE:${{ steps.tag.outputs.version }}" \
            target/wasm32-wasip2/release/storage_service.wasm:application/wasm
