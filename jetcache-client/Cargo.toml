[package]
name = "jetcache-client"
version = "2.0.0-rc.1"
edition = "2021"
description = "Typed Rust client SDK for jetcache (in-memory read-through cache backed by NATS JetStream KV)"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/Taika-3D-Oy/jetcache"
keywords = ["jetcache", "nats", "jetstream", "wasi", "cache"]
categories = ["caching", "wasm"]
authors = ["Taika 3D Oy"]
rust-version = "1.85"
autobins = false

[dependencies]
nats-wasi = { package = "nats-wasip3", version = "1.0.0-rc.1" }
wasip3 = { version = "0.7", features = ["async-spawn"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
futures = { version = "0.3", default-features = false, features = ["alloc"] }

[[example]]
name = "smoke_test"
crate-type = ["cdylib"]

[[example]]
name = "bench"
crate-type = ["cdylib"]
