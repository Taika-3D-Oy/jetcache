[workspace]
members = [
    "storage-service",
    "lattice-sql",
]
exclude = [
    "lattice-db-client",
    "lattice-sql-client",
]
resolver = "3"

[workspace.package]
edition = "2021"
version = "1.11.1"
authors = ["Taika 3D Oy"]
repository = "https://github.com/Taika-3D-Oy/lattice-db"
description = "NATS-native distributed database for wasmCloud"
license = "Apache-2.0"

[workspace.dependencies]
wasip3 = { version = "0.7", features = ["async-spawn"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"



[profile.release]
lto = "thin"
opt-level = "s"
strip = true
